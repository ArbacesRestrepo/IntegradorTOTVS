spring.application.name=IntegradorTOTVS
# =====================================================================
# CONFIGURACI\u00d3N DE N\u00daCLEO EXCLUSIVO - FUNERARIA SAN VICENTE
# Desactivamos el servidor Tomcat y el entorno HTTP web redundante (8443).
# Esto obliga a Spring Boot 3 a operar como una aplicaci\u00f3n perimetral pura,
# entreg\u00e1ndole el 100% de la CPU y los logs a sus 4 puertos de red UHF.
# =====================================================================
spring.main.web-application-type=servlet
spring.main.allow-bean-definition-overriding=true

server.port=8443
spring.application.name=nats-spring-demo
nats.server.url=nats://localhost:4222

# =====================================================================
# RESOLUCI\u00d3N DE COLISI\u00d3N DE BEANS - FUNERARIA SAN VICENTE
# Le ordena a Spring Boot 3 permitir que tus configuraciones de canales 
# manuales de TcpFlowConfig pisen las configuraciones autom\u00e1ticas.
# =====================================================================
spring.main.allow-bean-definition-overriding=true
spring.integration.ip.tcp.lookup-host=false

# =====================================================================
# BYPASS INDUSTRIAL DE AUTOCONFIGURACI\u00d3N - FUNERARIA SAN VICENTE
# Le ordena a Spring Boot saltarse estrictamente la inicializaci\u00f3n diferida 
# de mensajer\u00eda autom\u00e1tica que genera el puntero nulo en la versi\u00f3n M1,
# permitiendo que tus 4 Gateways manuales tomen el control del silicio.
# =====================================================================
#spring.autoconfigure.exclude=org.springframework.boot.integration.autoconfigure.IntegrationAutoConfiguration

# Archivo externo en el servidor (Solo lo que cambia)
DB_HOST=190.248.69.170:3128
DB_USER=UsrFusion
DB_PASS=FusionSQL
DB_NAME=FusionServicios


IntegradorTOTVS.GrupoEmpresa=1
IntegradorTOTVS.Empresa=1

## Fuerza a Spring Boot a usar expl\u00c3\u00adcitamente tu archivo de configuraci\u00c3\u00b3n
#logging.config=classpath:log4j2-spring.xml

# Enlaza el archivo de logs externo
#logging.config=file:./Config/log4j2-spring.xml

