# Activa el perfil 'secrets' para que Spring lea automáticamente config/application-secrets.properties
spring.profiles.include=secrets

spring.application.name=IntegradorTOTVS

# Puerto en el que correrá la aplicación por HTTPS
server.port=${server.port}


# =====================================================================
# POOL DE CONEXIONES HIKARI - MICROSOFT SQL SERVER (BD II)
# =====================================================================
spring.datasource.url=jdbc:sqlserver://${DB_HOST};databaseName=${DB_NAME};encrypt=false;trustServerCertificate=true;
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.session.store-type=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
spring.session.store-type=none
spring.autoconfigure.exclude=org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration,org.springframework.boot.autoconfigure.session.SessionAutoConfiguration


IntegradorTOTVS.GrupoEmpresa=${IntegradorTOTVS.GrupoEmpresa}
IntegradorTOTVS.Empresa=${IntegradorTOTVS.Empresa}
